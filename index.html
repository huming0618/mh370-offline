<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1419" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>MH370 离线数据</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48'%3E✈%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">✈</span>
          <div>
            <h1>MH370 离线数据</h1>
            <p id="meta" class="meta">加载中…</p>
          </div>
        </div>
        <button id="btn-fit" type="button" class="btn">适应视野</button>
      </header>
      <div id="filters" class="filters" role="tablist" aria-label="视图">
        <button type="button" class="filter-btn active" data-view="map-sea" role="tab">走廊地图</button>
        <button type="button" class="filter-btn" data-view="map-arc" role="tab">第七弧</button>
        <button type="button" class="filter-btn" data-view="timeline" role="tab">时间线</button>
        <button type="button" class="filter-btn" data-view="satcom" role="tab">握手</button>
        <button type="button" class="filter-btn" data-view="charts" role="tab">图表</button>
      </div>
      <div id="map" aria-label="MH370地图"></div>
      <div id="panel" class="panel" hidden></div>
      <div id="legend" class="legend" aria-label="图例">
        <span><i class="dot waypoint"></i>航路点</span>
        <span><i class="dot schematic"></i>示意</span>
        <span><i class="dot arc"></i>第七弧带</span>
      </div>
      <div id="status" class="status" hidden></div>
      <aside id="sheet" class="sheet" hidden>
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-body">
          <div class="sheet-head">
            <span id="sheet-level" class="badge"></span>
            <h2 id="sheet-title"></h2>
          </div>
          <p id="sheet-summary" class="sheet-summary"></p>
          <p id="sheet-meta" class="sheet-meta"></p>
          <div class="sheet-actions">
            <button id="btn-close" type="button" class="btn">关闭</button>
          </div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
